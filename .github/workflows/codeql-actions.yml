name: CodeQL (Actions)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "27 3 * * 1"
  workflow_dispatch:

# Least-privilege default; the analyze job elevates only what CodeQL needs.
permissions:
  contents: read

concurrency:
  group: codeql-actions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    # Keep this job name stable. It is the check-run name that branch
    # protection matches required status checks against, and it is unchanged
    # from when both languages shared one matrix workflow.
    name: Analyze (actions)
    runs-on: ubuntu-latest
    # security-events: write lets github/codeql-action/analyze upload SARIF
    # results to code scanning; the rest stay read-only.
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - name: Checkout
        # Pinned to a commit SHA per GitHub's supply-chain guidance for
        # third-party actions. The CodeQL actions below intentionally stay on
        # the @v4 major tag, as GitHub recommends for codeql-action.
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # No step pushes, so don't persist the token for later steps.
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          # GitHub Actions workflows need no build.
          languages: actions
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:actions"
