name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify VERSION matches tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          file_version="$(tr -d '[:space:]' < VERSION)"
          if [ "v$file_version" != "$TAG" ]; then
            echo "VERSION file ($file_version) does not match release tag ($TAG)." >&2
            echo "Update VERSION and re-tag before releasing." >&2
            exit 1
          fi

      - name: Create release zip
        run: |
          zip -r agent-sandbox-vm-${{ github.ref_name }}.zip \
            Bootstrap.ps1 \
            Start-Session.ps1 \
            autounattend.xml \
            scripts/ \
            vm/ \
            macos/ \
            AGENTS.md \
            CLAUDE.md \
            LICENSE \
            README.md \
            VERSION

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create ${{ github.ref_name }} \
            --generate-notes \
            agent-sandbox-vm-${{ github.ref_name }}.zip
